<svg id="mdvu-worker-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="max-width: 800px;" role="graphics-document document" aria-roledescription="venn"><style>#mdvu-worker-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mdvu-worker-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .error-icon{fill:#552222;}#mdvu-worker-diagram .error-text{fill:#552222;stroke:#552222;}#mdvu-worker-diagram .edge-thickness-normal{stroke-width:1px;}#mdvu-worker-diagram .edge-thickness-thick{stroke-width:3.5px;}#mdvu-worker-diagram .edge-pattern-solid{stroke-dasharray:0;}#mdvu-worker-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mdvu-worker-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mdvu-worker-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mdvu-worker-diagram .marker{fill:#333333;stroke:#333333;}#mdvu-worker-diagram .marker.cross{stroke:#333333;}#mdvu-worker-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdvu-worker-diagram p{margin:0;}#mdvu-worker-diagram .venn-title{font-size:32px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mdvu-worker-diagram .venn-circle text{font-size:48px;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mdvu-worker-diagram .venn-intersection text{font-size:48px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mdvu-worker-diagram .venn-text-node{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mdvu-worker-diagram .node .neo-node{stroke:#9370DB;}#mdvu-worker-diagram [data-look="neo"].node rect,#mdvu-worker-diagram [data-look="neo"].cluster rect,#mdvu-worker-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#mdvu-worker-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mdvu-worker-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mdvu-worker-diagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><text class="venn-title" font-size="16px" text-anchor="middle" dominant-baseline="middle" x="50%" y="16" style="fill: rgb(51, 51, 51);">"Viewer compatibility"</text><g transform="translate(0, 24)"><g class="venn-area venn-circle venn-set-0" data-venn-sets="Markdown"><path d="M 468.42364429106465 271.8480451360052 
