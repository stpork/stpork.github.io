<svg id="mdvu-worker-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#mdvu-worker-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mdvu-worker-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .error-icon{fill:#552222;}#mdvu-worker-diagram .error-text{fill:#552222;stroke:#552222;}#mdvu-worker-diagram .edge-thickness-normal{stroke-width:1px;}#mdvu-worker-diagram .edge-thickness-thick{stroke-width:3.5px;}#mdvu-worker-diagram .edge-pattern-solid{stroke-dasharray:0;}#mdvu-worker-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mdvu-worker-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mdvu-worker-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mdvu-worker-diagram .marker{fill:#333333;stroke:#333333;}#mdvu-worker-diagram .marker.cross{stroke:#333333;}#mdvu-worker-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdvu-worker-diagram p{margin:0;}#mdvu-worker-diagram .node .neo-node{stroke:#9370DB;}#mdvu-worker-diagram [data-look="neo"].node rect,#mdvu-worker-diagram [data-look="neo"].cluster rect,#mdvu-worker-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#mdvu-worker-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mdvu-worker-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mdvu-worker-diagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><rect width="700" height="500" class="background" fill="white"></rect><g class="chart-title"><text x="0" y="0" fill="#131300" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(348.6837890625, 21.611328125) rotate(0)">Typical document-open latency</text></g><g class="plot"><g class="bar-plot-0"><rect x="69.353515625" y="412.798828125" width="66.5" height="53.9453125" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="192.39365234375" y="372.072265625" width="66.5" height="94.671875" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="315.4337890625" y="310.982421875" width="66.5" height="155.76171875" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="438.47392578125005" y="224.43847656250003" width="66.5" height="242.30566406249997" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="561.5140625" y="112.4404296875" width="66.5" height="354.3037109375" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect></g><g class="line-plot-1"><path d="M102.604,430.617L225.644,412.799L348.684,384.799L471.724,336.437L594.764,275.347" fill="none" stroke="#8493A6" stroke-width="2"></path></g></g><g class="legend"><g class="markers"><rect x="639.7640625" y="237.4833984375" width="10.5" height="10.5" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><path d="M