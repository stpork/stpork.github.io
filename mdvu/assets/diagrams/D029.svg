<svg id="mdvu-worker-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 665.1875 450" style="max-width: 665.1875px;" role="graphics-document document" aria-roledescription="pie"><style>#mdvu-worker-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mdvu-worker-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .error-icon{fill:#552222;}#mdvu-worker-diagram .error-text{fill:#552222;stroke:#552222;}#mdvu-worker-diagram .edge-thickness-normal{stroke-width:1px;}#mdvu-worker-diagram .edge-thickness-thick{stroke-width:3.5px;}#mdvu-worker-diagram .edge-pattern-solid{stroke-dasharray:0;}#mdvu-worker-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mdvu-worker-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mdvu-worker-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mdvu-worker-diagram .marker{fill:#333333;stroke:#333333;}#mdvu-worker-diagram .marker.cross{stroke:#333333;}#mdvu-worker-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdvu-worker-diagram p{margin:0;}#mdvu-worker-diagram .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#mdvu-worker-diagram .pieCircle.highlighted{scale:1.05;opacity:1;}#mdvu-worker-diagram .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#mdvu-worker-diagram .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#mdvu-worker-diagram .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mdvu-worker-diagram .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#mdvu-worker-diagram .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#mdvu-worker-diagram .node .neo-node{stroke:#9370DB;}#mdvu-worker-diagram [data-look="neo"].node rect,#mdvu-worker-diagram [data-look="neo"].cluster rect,#mdvu-worker-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#mdvu-worker-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mdvu-worker-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mdvu-worker-diagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-57.168,175.945L0,0Z" fill="#ECECFF" class="pieCircle"></path><path d="M-57.168,175.945A185,185,0,0,1,-175.945,57.168L0,0Z" fill="#ffffde" class="pieCircle"></path><path d="M-175.945,57.168A185,185,0,0,1,-167.393,-78.769L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"></path><path d="M-167.393,-78.769A185,185,0,0,1,0,-185L0,0Z" fill="hsl(240, 100%, 86.2745098039%)" class="pieCircle"></path><text transform="translate(137.04175725757534,21.705282024332064)" class="slice" style="text-anchor: middle;">55%</text><text transform="translate(-98.11106588963355,98.1110658896334)" class="slice" style="text-anchor: middle;">15%</text><text transform="translate(-138.47620856942265,-8.712184584692409)" class="slice" style="text-anchor: middle;">12%</text><text transform="translate(-74.34596780333563,-117.15049966340469)" class="slice" style="text-anchor: middle;">18%</text></g><text x="0" y="-200" class="pieTitleText">Example document block mix</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"></rect><text x="22" y="14">Prose [55]</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);"></rect><text x="22" y="14">Tables and lists [15]</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(181, 255, 32); stroke: rgb(181, 255, 32);"></rect><text x="22" y="14">Code [12]</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(185, 185, 255); stroke: rgb(185, 185, 255);"></rect><text x="22" y="14">Mermaid [18]</text></g></g></svg>