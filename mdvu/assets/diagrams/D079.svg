am .railroad-nonterminal text{fill:#131300;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#mdvu-worker-diagram .railroad-line{stroke:#333333;stroke-width:2px;fill:none;}#mdvu-worker-diagram .railroad-start circle,#mdvu-worker-diagram .railroad-end circle{fill:#333333;}#mdvu-worker-diagram .railroad-comment ellipse{fill:rgba(232,232,232, 0.8);stroke:hsl(80, 60%, 86.2745098039%);stroke-width:2px;}#mdvu-worker-diagram .railroad-comment text{fill:rgb(6.3333333334, 0, 19.0000000001);font-style:italic;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#mdvu-worker-diagram .railroad-special rect{fill:hsl(80, 100%, 96.2745098039%);stroke:hsl(80, 60%, 86.2745098039%);stroke-width:2px;stroke-dasharray:5,3;}#mdvu-worker-diagram .railroad-special text{fill:#131300;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#mdvu-worker-diagram .railroad-rule-name{font-weight:bold;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdvu-worker-diagram .node .neo-node{stroke:#9370DB;}#mdvu-worker-diagram [data-look="neo"].node rect,#mdvu-worker-diagram [data-look="neo"].cluster rect,#mdvu-worker-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#mdvu-worker-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mdvu-worker-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mdvu-worker-diagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#mdvu-worker-diagram [data-look