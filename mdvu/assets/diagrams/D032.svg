<svg id="mdvu-worker-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 1092px;" viewBox="-30 -30 1092 470" role="graphics-document document" aria-roledescription="eventmodeling"><style>#mdvu-worker-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mdvu-worker-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .error-icon{fill:#552222;}#mdvu-worker-diagram .error-text{fill:#552222;stroke:#552222;}#mdvu-worker-diagram .edge-thickness-normal{stroke-width:1px;}#mdvu-worker-diagram .edge-thickness-thick{stroke-width:3.5px;}#mdvu-worker-diagram .edge-pattern-solid{stroke-dasharray:0;}#mdvu-worker-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mdvu-worker-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mdvu-worker-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mdvu-worker-diagram .marker{fill:#333333;stroke:#333333;}#mdvu-worker-diagram .marker.cross{stroke:#333333;}#mdvu-worker-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdvu-worker-diagram p{margin:0;}#mdvu-worker-diagram .node .neo-node{stroke:#9370DB;}#mdvu-worker-diagram [data-look="neo"].node rect,#mdvu-worker-diagram [data-look="neo"].cluster rect,#mdvu-worker-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#mdvu-worker-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mdvu-worker-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mdvu-worker-diagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="em-swimlane"><rect x="0" y="0" rx="3" width="1032" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="30">UI/Automation</text></g><g class="em-swimlane"><rect x="0" y="140" rx="3" width="1032" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="170">Command/Read Model</text></g><g class="em-swimlane"><rect x="0" y="280" rx="3" width="1032" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="310">Events</text></g><g class="em-box"><rect x="250" y="15" rx="3" width="148" height="100" stroke="#dbdada" fill="white"></rect><foreignObject x="260" y="25" width="128" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>Editor</b></span></div></foreignObject></g><g class="em-box"><rect x="328" y="155" rx="3" width="232" height="100" stroke="#679ac3" fill="#bcd6fe"></rect><foreignObject x="338" y="165" width="212" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>PublishDocument</b></span></div></foreignObject></g><g 