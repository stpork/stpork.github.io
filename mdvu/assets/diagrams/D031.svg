<svg id="mdvu-worker-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 235" style="max-width: 1026px;" role="graphics-document document" aria-roledescription="packet"><style>#mdvu-worker-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mdvu-worker-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mdvu-worker-diagram .error-icon{fill:#552222;}#mdvu-worker-diagram .error-text{fill:#552222;stroke:#552222;}#mdvu-worker-diagram .edge-thickness-normal{stroke-width:1px;}#mdvu-worker-diagram .edge-thickness-thick{stroke-width:3.5px;}#mdvu-worker-diagram .edge-pattern-solid{stroke-dasharray:0;}#mdvu-worker-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mdvu-worker-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mdvu-worker-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mdvu-worker-diagram .marker{fill:#333333;stroke:#333333;}#mdvu-worker-diagram .marker.cross{stroke:#333333;}#mdvu-worker-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdvu-worker-diagram p{margin:0;}#mdvu-worker-diagram .packetByte{font-size:10px;}#mdvu-worker-diagram .packetByte.start{fill:black;}#mdvu-worker-diagram .packetByte.end{fill:black;}#mdvu-worker-diagram .packetLabel{fill:black;font-size:12px;}#mdvu-worker-diagram .packetTitle{fill:black;font-size:14px;}#mdvu-worker-diagram .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#mdvu-worker-diagram .node .neo-node{stroke:#9370DB;}#mdvu-worker-diagram [data-look="neo"].node rect,#mdvu-worker-diagram [data-look="neo"].cluster rect,#mdvu-worker-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#mdvu-worker-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mdvu-worker-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mdvu-worker-diagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdvu-worker-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g><rect x="1" y="15" width="251" height="32" class="packetBlock"></rect><text x="126.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Version</text><text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">0</text><text x="252" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">7</text><rect x="257" y="15" width="251" height="32" class="packetBlock"></rect><text x="382.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Flags</text><text x="257" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">8</text><text x="508" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">15</text><rect x="513" y="15" width="507" height="32" class="packetBlock"></rect><text x="766.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Header length</text><text x="513" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">16</text><text x="1020" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">31</text></g><g><rect x="1" y="62" width="1019" height="32" class="packetBlock"></rect><text x="510.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Document ID hash</text><text x="1" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">32</text><text x="1020" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">63</text></g><g><rect x="1" y="109" width="1019" height="32" class="packetBlock"></rect><text x="510.5" y="125" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Content length</text><text x="1" y="107" class="packetByte start" dominant-baseline="auto" text-anchor="start">64</text><text x="1020" y="107" class="packetByte end" dominant-baseline="auto" text-anchor="end">95</text></g><g><rect x="1" y="156" width="1019" height="32" class="packetBlock"></rect><text x="510.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Checksum</text><text x="1" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="start">96</text><text x="1020" y="154" class="packetByte end" dominant-baseline="auto" text-anchor="end">127</text></g><text x="513" y="211.5" dominant-baseline="middle" text-anchor="middle" class="packetTitle">Simplified content envelope</text></svg>