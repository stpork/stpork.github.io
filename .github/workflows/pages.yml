name: Deploy MDVu website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate both languages and verify the site
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/build.py
          python3 scripts/check.py
          node --check mdvu/assets/site.js
          node --check mdvu/assets/theme.js
          node scripts/check-theme.cjs
          git diff --exit-code -- index.html ru/index.html mdvu/index.html mdvu/ru/index.html 404.html
      - name: Resolve currently published download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update-release.py
          python3 scripts/build.py
          python3 scripts/check.py
      - name: Package public files
        run: |
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml _site/
          cp -R ru mdvu _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
