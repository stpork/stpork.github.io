name: Deploy MDVu website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate both languages and verify the site
        run: |
          python3 scripts/build.py
          python3 scripts/check.py
          node --check assets/site.js
          git diff --exit-code -- index.html ru/index.html
      - name: Package public files
        run: |
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml sitemaps.xml _site/
          cp -R assets ru mdvu _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
